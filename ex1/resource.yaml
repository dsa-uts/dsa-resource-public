            path: gcd_recursive
        steps:
        - name: 18, 24のGCD
          run: ./gcd_recursive 18 24
          expected:
            exit-code: 0
            stdout:
              match: easy
              path: ex1-2/testcases/easy2.out
            stderr:
              match: easy
              path: ex1-2/testcases/easy2.err
        - name: 649, 826のGCD
          run: ./gcd_recursive 649 826
          expected:
            exit-code: 0
            stdout:
              match: easy
